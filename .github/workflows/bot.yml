name: Crypto Mission Bot
on:
  schedule:
    - cron: "30 23 * * *"    # 매일 08:30 KST 아침 브리핑
    - cron: "*/15 * * * *"   # 15분마다 속보 체크
  push:
    paths: ["queue/**"]      # Claude 요약이 올라오면 바로 게시
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 작업"
        type: choice
        options: [setup, morning, alerts, queue]
        default: setup
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then J="${{ inputs.job }}"
          elif [ "${{ github.event_name }}" = "push" ]; then J=queue
          elif [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then J=morning
          else J=alerts; fi
          case $J in setup) S=setup_room;; queue) S=post_queue;; *) S=$J;; esac
          echo "script=$S" >> $GITHUB_OUTPUT
          echo "작업: $J"
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p queue sent
          python bot/${{ steps.pick.outputs.script }}.py
      - name: Save state
        run: |
          git config user.name "crypto-mission-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -m "bot: ${{ steps.pick.outputs.script }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
